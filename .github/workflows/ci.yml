name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build the app (all electron-vite targets)
        run: npm run app:build

      # The engine is no longer vendored: the Electron main process forks
      # reasoning.run's prebuilt bin at runtime. Assert that entry resolves
      # from node_modules so a broken/missing dep fails CI, not the user.
      - name: Verify the forked engine entry is present
        run: test -f node_modules/reasoning.run/bin/run.js
