# electron-builder — packaging config.
#
# Native green was proven layer-1 with `asar: false`. This is the production
# config: `asar: true` (compressed, recommended) with `asarUnpack` for the native
# package tree — the `.node` AND its sibling dylibs must live on disk co-located
# in app.asar.unpacked (natives can't be dlopen'd from inside asar; @loader_path
# resolves the dylibs from the same bin/ dir). The loader's bare require() of the
# variant pkg resolves through Electron's transparent asar→unpacked redirect.
# The engine `dist/bundle.mjs` stays in asar; the utilityProcess forks it from there.
#
# Native deps are node-addon-api (N-API) prebuilts — no node-gyp — so
# `npmRebuild: false`. macOS auto-selects the Metal binary (default darwin-arm64).
appId: ai.lloyal.artifact
productName: Artifact
directories:
  output: release
asar: true
asarUnpack:
  - "**/node_modules/@lloyal-labs/lloyal.node*/**"
npmRebuild: false
# App files; electron-builder adds the production node_modules dependency tree.
# `dist/bundle.mjs` is the engine the utilityProcess forks (resolved relative to
# out/main → ../../dist/bundle.mjs).
files:
  - out/**
  - dist/bundle.mjs
  - package.json
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Local de-risk build: skip code signing (identity null). Real Developer-ID
  # signing + notarization is the Phase E ship gate (needs Apple creds).
  identity: null
  target:
    - dmg
